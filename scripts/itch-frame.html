<!doctype html>
<!-- Local stand-in for an itch.io game page. Served next to the built dist/ by `npm run itch-test`.
     Like itch, the game runs in a 1280×720 iframe on a DIFFERENT origin, inside a page that scrolls.
     Default: same host, the other itch-test port (4197 ↔ 4196), so no localhost/127.0.0.1 name mismatch.
     ?site=1: cross-SITE (127.0.0.1 ↔ localhost), closest to itch.io but its own renderer process; in a hidden or
     automated browser pane it may stay black until something forces a paint. ?same=1: same origin (inspectable).
     ?game=<url>: any other build. Not part of the release zip. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>itch.io embed test</title>
  <style>
    body { margin: 0; background: #2b2b2b; color: #ddd; font: 14px/1.5 system-ui, sans-serif; }
    header { padding: 12px 24px; background: #fa5c5c; color: #fff; font-weight: 700; }
    main { width: 1280px; margin: 24px auto; }
    #wrap { width: 1280px; height: 720px; background: #000; position: relative; }
    #wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    #bar { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
    button { font: inherit; padding: 4px 12px; }
    #hud { background: #111; padding: 8px 12px; border-radius: 6px; font: 12px/1.6 ui-monospace, monospace; white-space: pre; min-height: 5em; }
    .filler { height: 2200px; padding: 24px; color: #888; }
  </style>
</head>
<body>
  <header>itch.io (local embed test)</header>
  <main>
    <p>Click the game, then try: R, Tab, Esc, W A S D, Q E, 1 / 2, ? / H, arrow keys, Space, PageDown. <b>Parent scrollY must stay 0.</b></p>
    <div id="wrap">
      <iframe id="game" allow="autoplay; fullscreen *; gamepad; accelerometer; gyroscope; xr-spatial-tracking"
        scrolling="no" frameborder="0"></iframe>
    </div>
    <div id="bar">
      <button id="fs">⛶ Fullscreen (like itch's button)</button>
      <span id="origin"></span>
    </div>
    <div id="hud"></div>
    <div class="filler">Page content below the game (it makes this parent page scrollable, like a real itch page).</div>
  </main>
  <script>
    const frame = document.getElementById('game');
    const params = new URLSearchParams(location.search);
    const seed = params.get('seed');
    const ui = params.get('ui');
    const query = [seed && `seed=${seed}`, ui && `ui=${ui}`].filter(Boolean).join('&');
    let host = location.hostname, port = location.port;
    if (params.has('site')) host = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
    else if (!params.has('same')) port = port === '4197' ? '4196' : '4197'; // the other itch-test server
    frame.src = params.get('game') ?? `${location.protocol}//${host}:${port}/index.html${query ? `?${query}` : ''}`;
    document.getElementById('origin').textContent = `page ${location.origin} · game ${new URL(frame.src).origin}`;
    document.getElementById('fs').addEventListener('click', () => document.getElementById('wrap').requestFullscreen());
    const log = [];
    let frameLoaded = false;
    frame.addEventListener('load', () => { frameLoaded = true; log.push('game frame loaded'); });
    let lastY = 0;
    window.addEventListener('scroll', () => { if (scrollY !== lastY) log.push(`parent scrolled to ${scrollY}`); lastY = scrollY; });
    document.addEventListener('fullscreenchange', () => log.push(document.fullscreenElement ? 'entered fullscreen' : 'left fullscreen'));
    // Exposed for automated checks.
    window.__embed = { log };
    setInterval(() => {
      document.getElementById('hud').textContent =
        `frame: ${frameLoaded ? 'loaded' : 'LOADING… (click inside once it shows, before pressing keys)'}\nparent scrollY: ${scrollY}\nfocus: ${document.activeElement === frame ? 'IN GAME iframe' : document.activeElement?.tagName}\n` +
        `fullscreen: ${!!document.fullscreenElement}\n` + log.slice(-5).join('\n');
    }, 200);
  </script>
</body>
</html>
