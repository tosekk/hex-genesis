<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three building studies</title>
<style>body{margin:0;background:#f5f0e6;color:#3f4c3f;font:14px system-ui}canvas{display:block}aside{position:fixed;top:24px;left:24px;right:24px;pointer-events:none}h1{font:500 25px Georgia;margin:0 0 9px}p{margin:5px 0}small{color:#777}nav{position:fixed;bottom:20px;left:20px;right:20px;display:flex;flex-wrap:wrap;gap:6px}button{background:#f9f6ee;border:1px solid #b8b2a7;border-radius:6px;padding:9px 12px;color:#344f3e;cursor:pointer}button[aria-pressed=true]{background:#d9e3d4}</style></head><body>
<aside><h1 id="name">Lumber camp</h1><p>Compact vertex-color building · no ground plate</p><small id="info">Loading through the production model loader…</small></aside>
<nav><button data-model="lumber_camp">Lumber camp</button><button data-model="quarry">Quarry</button><button data-model="ice_drill">Ice drill</button><button id="front">Front</button><button id="quarter">Three-quarter</button><button id="back">Back</button><button id="spin">Turntable</button><button id="style">Illustrated / default</button></nav>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {parseModel} from '/src/render/modelAssets.ts';
import {createIllustratedMaterial,createInkMaterial} from '/src/render/materials.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#f5f0e6');renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,20),controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.21,0);controls.enableDamping=true;controls.minDistance=.55;controls.maxDistance=5;
const fit=()=>Math.max(1,1/camera.aspect),view=pos=>{camera.position.set(...pos).sub(controls.target).multiplyScalar(fit()*1.18).add(controls.target);controls.update();};view([.68,.63,.97]);
scene.add(new THREE.HemisphereLight('#fff1db','#bac8d7',2));const key=new THREE.DirectionalLight('#fff1de',2.5);key.position.set(-2,4,3);scene.add(key);
const illustrated=createIllustratedMaterial(),ink=createInkMaterial(),lit=new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1});ink.uniforms.viewport.value.set(innerWidth,innerHeight);ink.uniforms.inkWidth.value=.7;
const group=new THREE.Group();scene.add(group);let meshes=[],hulls=[],spin=false,useIllustrated=true;
const models={};for(const id of ['lumber_camp','quarry','ice_drill'])models[id]=await parseModel(await(await fetch(`./out/${id}.glb`)).arrayBuffer(),id);
function show(id){group.clear();group.rotation.y=0;meshes=[];hulls=[];for(const g of models[id].parts){const mesh=new THREE.Mesh(g,useIllustrated?illustrated:lit),hull=new THREE.Mesh(g,ink);hull.visible=useIllustrated;group.add(mesh,hull);meshes.push(mesh);hulls.push(hull);}document.querySelector('#name').textContent=id.replaceAll('_',' ');document.querySelector('#info').textContent=`${models[id].triangles} triangles · production loader accepted · ${useIllustrated?'illustrated':'default lit'} material`;document.querySelectorAll('[data-model]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.model===id)));}
let current='lumber_camp';show(current);document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{current=b.dataset.model;show(current);});
document.querySelector('#spin').onclick=()=>spin=!spin;document.querySelector('#style').onclick=()=>{useIllustrated=!useIllustrated;show(current);};
for(const[id,pos]of[['front',[0,.52,1.06]],['quarter',[.68,.63,.97]],['back',[-.4,.60,-1.06]]])document.getElementById(id).onclick=()=>{spin=false;group.rotation.y=0;view(pos);};
addEventListener('resize',()=>{const old=fit();camera.aspect=innerWidth/innerHeight;camera.position.sub(controls.target).multiplyScalar(fit()/old).add(controls.target);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);ink.uniforms.viewport.value.set(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{if(spin)group.rotation.y+=.004;controls.update();renderer.render(scene,camera);});
</script></body></html>
