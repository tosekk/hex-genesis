<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sol · Icon sheet</title><style>
body{margin:24px;background:#f4ead5;color:#2e2a25;font:14px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:1280px}article{border:1.8px solid #293b34;border-radius:9px;overflow:hidden}h2{font-size:14px;padding:0 12px}.row{display:flex;align-items:center;gap:16px;padding:16px;background:#f4ead5}.row.dark{background:#6b6257}.row img:nth-child(1){width:24px;height:24px}.row img:nth-child(2){width:32px;height:32px}.row img:nth-child(3){width:64px;height:64px}p{line-height:1.5}
</style><h1>Terraform · field journal icons</h1><p>Flat SVG set · 24 / 32 / 64 px · journal paper and dark backgrounds</p><main id="icons"></main><script type="module">
import { DEFAULT_CONFIG } from '../config/index.ts';
const ids=['wood','stone','water','food','forest','desert','arctic','steppe','taiga','polarDesert',...Object.keys(DEFAULT_CONFIG.buildings).map(id=>`buildings/${id}`),'terrain/mountain','terrain/water','terrain/woods','terrain/marsh','core'];
for(const id of ids){const card=document.createElement('article'),title=document.createElement('h2');title.textContent=DEFAULT_CONFIG.buildings[id.replace('buildings/','')]?.name ?? id;card.append(title);for(const theme of ['row','row dark']){const row=document.createElement('div');row.className=theme;for(const size of [24,32,64]){const img=document.createElement('img');img.src=`/assets/icons/${id}.svg`;img.alt=title.textContent;img.width=size;img.height=size;row.append(img)}card.append(row)}document.querySelector('#icons').append(card)}
</script></html>
