<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sol · Icon sheet</title><style>
body{margin:24px;background:#293b34;color:#edf0d9;font:14px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px;max-width:1050px}article{border:1px solid #91ae94;border-radius:9px;overflow:hidden}h2{font-size:14px;padding:0 12px}.row{display:flex;align-items:center;gap:16px;padding:16px;background:#eee6cd}.row.dark{background:#567264}.row img:nth-child(1){width:16px;height:16px}.row img:nth-child(2){width:24px;height:24px}.row img:nth-child(3){width:48px;height:48px}p{line-height:1.5}
</style><h1>Terraform · resources and biomes</h1><p>Flat SVG set · 16 / 24 / 48 px · light and dark backgrounds</p><main id="icons"></main><script type="module">
const ids=['wood','stone','water','food','forest','desert','arctic','steppe','taiga','polarDesert'];
for(const id of ids){const card=document.createElement('article'),title=document.createElement('h2');title.textContent=id;card.append(title);for(const theme of ['row','row dark']){const row=document.createElement('div');row.className=theme;for(const size of [16,24,48]){const img=document.createElement('img');img.src=`/assets/icons/${id}.svg`;img.alt=id;img.width=size;img.height=size;row.append(img)}card.append(row)}document.querySelector('#icons').append(card)}
</script></html>
